<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURA - TV Display Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="login-container">
        <table cellpadding="0" cellspacing="0" border="0" width="100%" height="100%">
            <tr>
                <td align="center" valign="middle">
                    <div id="login-box">
                        <div id="logo-container">
                            <img src="cura-logo.png" alt="CURA Logo" id="logo" onerror="this.src='login-logo.png'">
                            <h1>CURA</h1>
                            <p class="subtitle">Healthcare Management System</p>
                            <p class="subtitle-small">TV Display</p>
                        </div>

                        <form id="login-form" onsubmit="return handleLogin(event)">
                            <div id="error-message" style="display: none;"></div>

                            <div class="form-group">
                                <label for="hospital_id">Hospital ID</label>
                                <input type="text" id="hospital_id" name="hospital_id" placeholder="Enter Hospital ID"
                                    required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" placeholder="Enter your password"
                                    required>
                            </div>

                            <button type="submit" id="login-btn">
                                <span id="btn-text">Sign In</span>
                                <span id="btn-loading" style="display: none;">Signing in...</span>
                            </button>
                        </form>

                        <div id="footer-text">
                            <p><strong>Technesian Cura</strong> <span class="separator">|</span> Revolutionizing
                                Hospital Management</p>
                            <p class="copyright">© <span class="current-year">2026</span> Technesian. All rights
                                reserved. <span class="separator">•</span> <a href="https://www.technesian.com"
                                    target="_blank">www.technesian.com</a></p>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script src="app.js"></script>
</body>

</html>
