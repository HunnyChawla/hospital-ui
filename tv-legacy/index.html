<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS - TV Display Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-container">
        <table cellpadding="0" cellspacing="0" border="0" width="100%" height="100%">
            <tr>
                <td align="center" valign="middle">
                    <div id="login-box">
                        <div id="logo-container">
                            <img src="../public/login-logo.png" alt="Hospital Logo" id="logo" onerror="this.style.display='none'">
                            <h1>Hospital Management System</h1>
                            <p>TV Display Login</p>
                        </div>
                        
                        <form id="login-form" onsubmit="return handleLogin(event)">
                            <div id="error-message" style="display: none;"></div>
                            
                            <div class="form-group">
                                <label for="hospital_id">Hospital ID</label>
                                <input type="text" id="hospital_id" name="hospital_id" placeholder="Enter Hospital ID" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="api_url">Backend URL</label>
                                <input type="text" id="api_url" name="api_url" placeholder="http://localhost:8080" value="http://localhost:8080">
                                <small style="color: #666; font-size: 11px;">Enter your backend server URL</small>
                            </div>
                            
                            <button type="submit" id="login-btn">
                                <span id="btn-text">Login to TV Display</span>
                                <span id="btn-loading" style="display: none;">Logging in...</span>
                            </button>
                        </form>
                        
                        <div id="footer-text">
                            <p>© 2024 Hospital Management System</p>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
