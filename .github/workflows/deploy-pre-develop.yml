name: Build, Push to OCIR, and Deploy to Oracle Cloud (pre-develop)

on:
  push:
    branches:
      - pre-develop
  workflow_dispatch:

concurrency:
  group: deploy-ui-pre-develop-${{ github.ref }}
  cancel-in-progress: true

env:
  OCI_REGION_KEY: ${{ vars.OCI_REGION_KEY || secrets.OCI_REGION_KEY || 'bom' }}
  OCI_TENANCY_NAMESPACE: ${{ vars.OCI_TENANCY_NAMESPACE || secrets.OCI_TENANCY_NAMESPACE }}
  OCIR_UI_REPOSITORY: hospital-ui
  OCIR_TV_REPOSITORY: tv-legacy-display
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL || '/api' }}
  NEXT_PUBLIC_DOMAIN_URL: ${{ vars.NEXT_PUBLIC_DOMAIN_URL || secrets.NEXT_PUBLIC_DOMAIN_URL || '' }}

jobs:
  build-and-push:
    name: Build and Push Docker Images to OCIR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve OCIR Username
        id: ocir-auth
        run: |
          RAW_USER="${{ secrets.OCI_OCIR_USERNAME }}"
          NAMESPACE="${{ env.OCI_TENANCY_NAMESPACE }}"
          if [[ "$RAW_USER" == *"/"* ]]; then
            FORMATTED_USER="$RAW_USER"
          elif [ -n "$NAMESPACE" ]; then
            FORMATTED_USER="${NAMESPACE}/${RAW_USER}"
          else
            FORMATTED_USER="$RAW_USER"
          fi
          echo "username=$FORMATTED_USER" >> $GITHUB_OUTPUT

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION_KEY }}.ocir.io
          username: ${{ steps.ocir-auth.outputs.username }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and Push Hospital UI Docker Image to OCIR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_PATH=
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_DOMAIN_URL=${{ env.NEXT_PUBLIC_DOMAIN_URL }}
          tags: |
            ${{ env.OCI_REGION_KEY }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/${{ env.OCIR_UI_REPOSITORY }}:pre-develop
            ${{ env.OCI_REGION_KEY }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/${{ env.OCIR_UI_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push TV Legacy Docker Image to OCIR
        uses: docker/build-push-action@v5
        with:
          context: ./tv-legacy
          file: ./tv-legacy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.OCI_REGION_KEY }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/${{ env.OCIR_TV_REPOSITORY }}:pre-develop
            ${{ env.OCI_REGION_KEY }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/${{ env.OCIR_TV_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy UI & TV Legacy to Oracle Cloud VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate Host Configuration
        run: |
          if [ -z "${{ secrets.OCI_HOST }}" ]; then
            echo "::error::OCI_HOST secret is not configured. Please add OCI_HOST to repository secrets."
            exit 1
          fi
          echo "Target OCI Host IP: ${{ secrets.OCI_HOST }}"

      - name: SSH and Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          envs: NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_DOMAIN_URL
          script: |
            set -e

            USER_NAME="${{ secrets.OCI_USER || 'ubuntu' }}"
            OCIR_REGISTRY="${{ env.OCI_REGION_KEY }}.ocir.io"
            NAMESPACE="${{ env.OCI_TENANCY_NAMESPACE }}"
            UI_IMAGE_TAG="${OCIR_REGISTRY}/${NAMESPACE}/${{ env.OCIR_UI_REPOSITORY }}:${{ github.sha }}"
            TV_IMAGE_TAG="${OCIR_REGISTRY}/${NAMESPACE}/${{ env.OCIR_TV_REPOSITORY }}:${{ github.sha }}"

            echo "Authenticating Docker with OCIR on VM..."
            RAW_USER="${{ secrets.OCI_OCIR_USERNAME }}"
            if [[ "$RAW_USER" == *"/"* ]]; then
              FINAL_USER="$RAW_USER"
            elif [ -n "$NAMESPACE" ]; then
              FINAL_USER="${NAMESPACE}/${RAW_USER}"
            else
              FINAL_USER="$RAW_USER"
            fi

            echo "${{ secrets.OCI_AUTH_TOKEN }}" | sudo docker login --username "$FINAL_USER" --password-stdin "$OCIR_REGISTRY"

            # 1. Ensure shared Docker network exists
            sudo docker network create hms-network 2>/dev/null || true

            # 2. Pull new images
            echo "Pulling latest images from OCIR..."
            sudo docker pull "$UI_IMAGE_TAG"
            sudo docker pull "$TV_IMAGE_TAG"

            # 3. Deploy / Update hospital-ui container
            echo "Deploying hospital-ui container..."
            sudo docker stop hospital-ui 2>/dev/null || true
            sudo docker rm hospital-ui 2>/dev/null || true

            sudo docker run -d \
              --name hospital-ui \
              --network hms-network \
              --restart unless-stopped \
              -e NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-/api}" \
              -e NEXT_PUBLIC_DOMAIN_URL="${NEXT_PUBLIC_DOMAIN_URL:-}" \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$UI_IMAGE_TAG"

            # 4. Deploy / Update tv-legacy container
            echo "Deploying tv-legacy container..."
            sudo docker stop tv-legacy 2>/dev/null || true
            sudo docker rm tv-legacy 2>/dev/null || true

            sudo docker run -d \
              --name tv-legacy \
              --network hms-network \
              --restart unless-stopped \
              -e PORT=5500 \
              -e API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-/api}" \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$TV_IMAGE_TAG"

            # Connect hospital-ui and tv-legacy to any additional network hms-caddy is on (e.g. hms-deploy_hms-network)
            CADDY_NETWORKS=$(sudo docker inspect hms-caddy --format '{{range $net, $v := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null || true)
            for net in $CADDY_NETWORKS; do
              if [ -n "$net" ] && [ "$net" != "hms-network" ]; then
                echo "Connecting UI & TV containers to Caddy network: $net"
                sudo docker network connect "$net" hospital-ui 2>/dev/null || true
                sudo docker network connect "$net" tv-legacy 2>/dev/null || true
              fi
            done

            # 5. Reload Caddy reverse proxy configuration if running
            echo "Reloading Caddy reverse proxy..."
            sudo docker exec hms-caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || \
            (cd "/home/$USER_NAME/hms-deploy" 2>/dev/null && sudo docker compose exec -T caddy caddy reload 2>/dev/null) || true

            # 6. Verify hospital-ui health
            echo "Verifying hospital-ui health..."
            UI_HEALTH_OK=false
            for i in $(seq 1 12); do
              status_code=$(curl -s -L -k -o /dev/null -w "%{http_code}" "http://localhost/") || status_code="000"
              if [ "$status_code" = "200" ] || [ "$status_code" = "304" ]; then
                echo "hospital-ui responded with HTTP $status_code (healthy)."
                UI_HEALTH_OK=true
                break
              fi
              echo "Attempt $i: status $status_code, waiting 5 seconds..."
              sleep 5
            done

            if [ "$UI_HEALTH_OK" != "true" ]; then
              echo "Warning: UI health check did not return 200 after 60s. Logs:"
              sudo docker logs hospital-ui --tail=50
            fi

            # 7. Clean up dangling images
            sudo docker image prune -f

            # 8. Print running containers
            sudo docker ps --filter "network=hms-network"
            echo "Deploy finished successfully."
