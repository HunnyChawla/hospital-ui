server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress Nginx software version disclosure in Server header and error pages
    server_tokens off;

    # Header safety and request parsing constraints
    ignore_invalid_headers on;
    underscores_in_headers off;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Protocol Downgrade Prevention: explicitly reject obsolete HTTP/1.0 and HTTP/0.9
    if ($server_protocol !~* "^HTTP/(1\.1|2(\.0)?)$") {
        return 426;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com https://cdn.jsdelivr.net https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' blob: data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com https://cdn.jsdelivr.net https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' blob: data:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;
    }

    # Handle Next.js static export routing
    # Try to serve the file, if not found, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Handle client and server errors with custom clean error page (no server signature/version)
    error_page 400 401 402 403 405 406 408 413 414 415 426 500 501 502 503 504 /error.html;
    location = /error.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
