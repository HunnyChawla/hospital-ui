<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Error | Hospital Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }
        .icon {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.5rem;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f87171;
            font-size: 1.75rem;
            font-weight: bold;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.75rem 1.75rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Unable to Process Request</h1>
        <p>The server could not fulfill your request due to an invalid method or unexpected error. Please return to the application.</p>
        <a href="/" class="btn">Return to Application</a>
    </div>
</body>
</html>
